<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LitRPG Меню</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--card:#241546cc;--accent:#7c4dff;--accent2:#b388ff;--text:#f3efff;--muted:#9d8fc0}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,system-ui,sans-serif;color:var(--text);padding-bottom:80px;
  background:linear-gradient(180deg,#2a1650 0%,#1b0f38 45%,#120a26 100%);background-attachment:fixed}
header{position:relative;background:linear-gradient(180deg,#7c4dff,#4a2b8f);padding:22px 16px 40px;text-align:center;border-radius:0 0 24px 24px;overflow:hidden}
header .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.4;filter:blur(2px)}
header .inner{position:relative}
.avatar{width:86px;height:86px;border-radius:50%;overflow:hidden;margin:0 auto 10px;border:2px solid #ffffff66;background:#ffffff22}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:20px}
.sub{font-size:12px;opacity:.85;margin-top:4px}
.chips{display:flex;gap:7px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.chip{background:#00000044;border-radius:20px;padding:6px 12px;font-size:12px}
.herobar{padding:10px 14px;font-size:16px;background:#ffffff0d;border-bottom:1px solid #ffffff0d}
nav{position:fixed;bottom:10px;left:10px;right:10px;background:#241d33f2;border-radius:20px;display:flex;justify-content:space-around;padding:7px 2px;backdrop-filter:blur(8px);box-shadow:0 6px 20px #00000088}
nav button{background:none;border:none;color:var(--muted);font-size:9px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 4px;border-radius:12px}
nav button .ic{font-size:18px}
nav button.active{color:var(--accent2);background:#7c4dff22}
section{padding:14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #ffffff0d;font-size:14px}
.row:last-child{border:none}
.btn{background:var(--accent);border:none;color:#fff;border-radius:12px;padding:8px 13px;font-size:13px;margin:4px 4px 0 0}
.btn.ghost{background:#ffffff14}
.btn.danger{background:#8f2b3a}
.bar{height:8px;border-radius:4px;background:#ffffff14;margin:4px 0}
.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:#ffffff0d;border-radius:12px;padding:12px;font-size:13px;cursor:pointer}
.item:active{background:#ffffff1a}
.muted{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:#ffffff0d;border:none;color:var(--muted);border-radius:12px;padding:8px 8px;font-size:11px}
.tabs button.active{background:var(--accent);color:#fff}
.ta{width:100%;min-height:70px;background:#ffffff0d;border:1px solid #ffffff14;border-radius:10px;color:var(--text);padding:8px;font-size:13px;margin:4px 0}
.in{background:#ffffff0d;border:1px solid #ffffff14;border-radius:10px;color:var(--text);padding:6px 8px;width:110px;font-size:13px}
.enc{display:flex;gap:10px;align-items:center;background:#ffffff0d;border-radius:12px;padding:10px;margin-bottom:10px;cursor:pointer}
.enc img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#ffffff14}
.enc .t{flex:1}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:6px 0}
.statgrid label{font-size:12px;color:var(--muted)}
.statgrid input{width:100%}
.wcard{background:#ffffff0d;border-radius:14px;overflow:hidden;margin-bottom:12px;cursor:pointer;text-align:center}
.wcard img{width:100%;height:120px;object-fit:cover;background:#ffffff14}
.wcard b{display:block;padding:10px}
</style>
</head>
<body>
<header>
  <div class="bg" id="scen_bg"></div>
  <div class="inner">
    <div class="avatar"><img id="hero_img" src="avatar.jpg" alt="" onerror="this.src='avatar.jpg'"></div>
    <h1 id="scen_name">LitRPG</h1>
    <div class="sub" id="hello"></div>
    <div class="chips" id="chips"></div>
  </div>
</header>
<div class="herobar">👤 <b id="hero_name"></b> <span class="muted" id="hero_pos"></span></div>
<section id="content"></section>
<nav id="nav"></nav>
<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const INIT = tg.initData;
const NGROK = 'https://unexpired-pogo-splotchy.ngrok-free.dev';
const API_BASE = location.hostname.endsWith('github.io') ? NGROK : '';
let STATE=null, tab='home', enc_sub='scenario', enc_sel=null, editCtx=null;
let itemSel=null, worldSel=null, locSel=null, heroEdit=false, IMG_V=1, ARB_LOG=[];

const STAT_RU = {strength:'Сила', magic_power:'Магическая сила', intelligence:'Интеллект',
 health:'Здоровье', max_health:'Макс. здоровье', speed:'Скорость', armor:'Броня', magic:'Магия',
 luck:'Удача', charisma:'Харизма', crit_chance_phys:'Крит физ. шанс', crit_multiplier_phys:'Крит физ. множитель',
 crit_chance_mag:'Крит маг. шанс', crit_multiplier_mag:'Крит маг. множитель',
 resist_fire:'Сопротивление огню', resist_water:'Сопротивление воде', resist_earth:'Сопротивление земле',
 resist_air:'Сопротивление воздуху', resist_light:'Сопротивление свету', resist_dark:'Сопротивление тьме'};
const SLOT_RU = {hand:'Оружие (рука)', head:'Голова', body:'Тело', legs:'Ноги', feet:'Ступни',
 accessory:'Аксессуар', consumable:'Расходник', quest:'Квестовый'};
const GENDER_RU = {male:'Мужчина', female:'Женщина'};
const ru = k => STAT_RU[k] || SLOT_RU[k] || (k ? k[0].toUpperCase()+k.slice(1) : k);
const QUAL_RU = {1:'Ржавый',2:'Обычный',3:'Качественный',4:'Редкий',5:'Эпический',6:'Легендарный'};
const STATUS_RU = {not_done:'Не начато', in_progress:'В процессе', completed:'Завершено'};

const NAV=[{id:'home',ic:'🏠',t:'Домой'},{id:'hero',ic:'👤',t:'Герой'},{id:'inv',ic:'🎒',t:'Вещи'},
 {id:'map',ic:'🗺️',t:'Карта'},{id:'ency',ic:'📚',t:'Энцикл.'},{id:'arbiter',ic:'⚖️',t:'Арбитр'},{id:'worlds',ic:'🌍',t:'Миры'}];
const MENU=[{id:'hero',ic:'👤',t:'Персонаж',d:'Имя, пол, статы, внешность'},
 {id:'inv',ic:'🎒',t:'Инвентарь',d:'Карточки вещей с миниатюрами'},
 {id:'quests',ic:'📜',t:'Квесты',d:'Активные квесты'},{id:'map',ic:'🗺️',t:'Карта',d:'Локации и перемещение'},
 {id:'ency',ic:'📚',t:'Энциклопедия',d:'Мир, NPC, предметы, умения, расы'},
 {id:'arbiter',ic:'⚖️',t:'Арбитр',d:'Вопрос-ответ: правки мира'},
 {id:'worlds',ic:'🌍',t:'Миры',d:'Выбор мира, сброс'}];
const TACTICS={balanced:'⚖ Сбалансированная',aggressive:'🗡 Агрессивная',defensive:'🛡 Защитная',support:'💠 Поддержка'};
const ENC_TABS=[{id:'scenario',ic:'🌍',t:'Мир'},{id:'location',ic:'🗺️',t:'Локации'},{id:'npc',ic:'👥',t:'NPC'},
 {id:'item',ic:'🎒',t:'Предметы'},{id:'cskill',ic:'⚔️',t:'Боевые ум.'},{id:'nskill',ic:'✨',t:'Мирные ум.'},
 {id:'effect',ic:'🧪',t:'Эффекты'},{id:'race',ic:'🧬',t:'Расы'},{id:'faction',ic:'🏰',t:'Фракции'}];
const SCHEMA={
 scenario:[['name','Название','text'],['genre','Жанр','text'],['description','Описание мира','area'],
  ['greeting','Приветствие','area'],['image_prompt','Промт вида (EN)','area','img']],
 location:[['name','Название','text'],['description','Описание','area'],['image_prompt','Промт вида (EN)','area','img'],
  ['is_safe','Безопасная (точка возрождения)','check'],['effects_json','Характеристики локации','statsgrid']],
 npc:[['name','Имя','text'],['gender','Пол (male/female)','text'],['race','Раса','text'],['npc_type','Тип (base/named)','text'],
  ['position','Должность','text'],['role_description','Роль в мире','area'],['image_prompt','Промт вида (EN)','area','img'],
  ['mood','Настроение 0–100','num'],['affection','Привязанность 0–100','num'],
  ['intimacy','Раскрепощённость 0–100','num'],['reputation','Репутация 0–100','num'],
  ['is_merchant','Торговец','check'],['is_immortal','Бессмертный','check'],['ability_craft','Ремесло (крафт)','text'],
  ['base_stats','Базовые характеристики','statsgrid'],['effective_stats','Эффективные характеристики','statsgrid']],
 item:[['name','Название','text'],['quality','Качество 1–6','num'],['slot','Слот','text'],
  ['rarity','Редкость (common/rare/epic)','text'],['price','Цена','num'],['revealing_level','Открытость 0–5','num'],
  ['action','Действие (equip/use)','text'],['description','Описание','area'],['image_prompt','Промт вида (EN)','area','img'],
  ['base_stat_modifiers','Параметры предмета','statsgrid']],
 cskill:[['name','Название','text'],['description','Описание','area'],['damage_type','Тип (physical/magical)','text'],
  ['base_damage','Урон','num'],['cooldown','Кулдаун (ходов)','num'],['speed_bonus','Бонус скорости','num'],
  ['stat_modifiers','Влияние на характеристики','statsgrid']],
 nskill:[['name','Название','text'],['description','Описание','area'],['stat_modifiers','Влияние на характеристики','statsgrid'],
  ['duration_days','Длительность (сутки)','num']],
 effect:[['name','Название','text'],['description','Описание','area'],['stat_modifiers','Влияние на характеристики','statsgrid'],
  ['power_grade','Сила −5…+5','num'],['duration_type','Тип (battle/days)','text'],['duration_value','Значение','num']],
 race:[['name','Название','text'],['description','Описание','area'],['base_stats','Базовые характеристики','statsgrid'],
  ['max_level','Макс. уровень','num']],
 faction:[['name','Название','text'],['description','Описание','area'],['reputation','Репутация 0–100','num']],
 hero:[['name','Имя героя (как к нему обращаются NPC)','text'],['gender','Пол (male/female)','text'],
  ['position','Должность','text'],['role_description','Роль в мире','area'],
  ['image_prompt','Промт внешности (EN)','area','img'],
  ['base_stats','Базовые характеристики','statsgrid'],['effective_stats','Эффективные характеристики','statsgrid']]};
const GEN_MAP={scenario:'scenario',location:'location',npc:'npc',item:'item'};
const UPLOADABLE=['hero','npc','item','location','scenario'];

async function api(path,body={}){try{const r=await fetch(API_BASE+path,{method:'POST',
 headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'true'},
 body:JSON.stringify({init_data:INIT,...body})});return await r.json();}catch(e){return{ok:false,error:'network'};}}
async function refresh(){STATE=await api('/api/menu/state');await render();}
window.setTab=async id=>{tab=id;enc_sel=null;editCtx=null;itemSel=null;worldSel=null;locSel=null;heroEdit=false;await render();};
window.setEncSub=async id=>{enc_sub=id;enc_sel=null;editCtx=null;await render();};
window.openEnc=async id=>{enc_sel={entity:enc_sub,id};editCtx=enc_sel;await render();};
window.encBack=async()=>{enc_sel=null;editCtx=null;await render();};
window.openItem=async id=>{itemSel=STATE.inventory.find(i=>i.inv===id)||null;await render();};
window.closeItem=async()=>{itemSel=null;await render();};
window.openWorld=async id=>{worldSel=STATE.scenarios.find(w=>w.id===id)||null;await render();};
window.closeWorld=async()=>{worldSel=null;await render();};
window.openLoc=async id=>{locSel=STATE.locations.find(l=>l.id===id)||null;await render();};
window.closeLoc=async()=>{locSel=null;await render();};
window.heroEditToggle=async()=>{heroEdit=!heroEdit;
 editCtx=heroEdit?{entity:'hero',id:STATE.hero.id}:null;await render();};
window.act=async(a,p={})=>{await api('/api/menu/action',{action:a,params:p});itemSel=null;locSel=null;await refresh();};
window.genImg=async(type,id)=>{const r=await api('/api/gen_entity_image',{entity_type:type,id});
 if(r.ok){IMG_V=Date.now();await refresh();}else{tg.showAlert('🎨 '+(r.error||'ошибка генерации'));}};
window.resetWorld=async(id)=>{
 let ok=false;
 try{ok=await new Promise(res=>tg.showConfirm({title:'Сбросить мир?',
  message:'Удалятся: квесты, события, именные NPC, локации (кроме стартовой), предметы (кроме бутылей), инвентарь. Герой вернётся к 1 ур. Генерация мира продолжится под руководством Арбитра.'},r=>res(r)));}
 catch(e){ok=confirm('Сбросить мир?');}
 if(!ok)return;
 const r=await api('/api/reset_world',{scenario_id:id});
 tg.showAlert(r.ok?'♻️ Мир сброшен. Попроси Арбитра создать локации, NPC и события.':'❌ '+(r.error||'ошибка'));
 await refresh();};
window.arbSend=async()=>{const el=document.getElementById('arb_in');const t=el.value.trim();if(!t)return;
 el.value='';ARB_LOG.push({q:t,a:'⏳ Арбитр думает...'});await render();
 const r=await api('/api/arbiter',{text:t});
 ARB_LOG[ARB_LOG.length-1].a=r.ok?(r.reply||'Готово.'):'❌ '+(r.error||'ошибка');
 await render();};
const card=(t,b)=>`<div class="card"><h3>${t}</h3>${b}</div>`;
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const thumbOf=s=>s&&s.includes('/media/images/')?s.replace('/media/images/','/media/images/thumbs/'):s;
const imgTag=(src,w)=>src?`<img src="${API_BASE||''}${thumbOf(src)}?v=${IMG_V}" onerror="this.onerror=null;this.src=this.src.replace('/thumbs/','')" style="width:${w||52}px;height:${w||52}px;border-radius:10px;object-fit:cover;background:#ffffff14">`:`<div style="width:${w||52}px;height:${w||52}px;border-radius:10px;background:#ffffff14"></div>`;
const modsRows=m=>Object.entries(m||{}).map(([k,v])=>`<div class="row"><span>${ru(k)}</span><b>${v}</b></div>`).join('')||'<div class="muted">Нет параметров</div>';
function statsGrid(key,jsonStr){
 let obj={};try{obj=JSON.parse(jsonStr||'{}');}catch(e){}
 return `<div class="muted" style="margin-top:6px">${ru(key)}</div><div class="statgrid">`+
  Object.entries(obj).map(([k,v])=>`<div><label>${ru(k)}</label><input class="in sg" data-sg="${key}" data-k="${k}" type="number" step="any" value="${esc(v)}" style="width:100%"></div>`).join('')+`</div>`;
}
window.trPrompt=async key=>{const el=document.getElementById('ef_'+key);if(!el)return;
 const r=await api('/api/translate',{text:el.value});if(r.ok){el.value=r.en;tg.showAlert('🇬🇧 Переведено на английский');}};
window.uploadEntity=async(inp,entity,id)=>{const f=inp.files[0];if(!f)return;
 const fd=new FormData();fd.append('file',f);
 try{const resp=await fetch(`${API_BASE}/api/upload_entity_image?entity=${entity}&id=${id}`,
   {method:'POST',headers:{'ngrok-skip-browser-warning':'true'},body:fd});
  const res=await resp.json();
  if(res.ok){IMG_V=Date.now();await render();}else{tg.showAlert(res.error||'Ошибка загрузки');}
 }catch(e){tg.showAlert('Нет связи с сервером');}};
window.encSave=async()=>{
 const ec=editCtx||enc_sel; if(!ec){tg.showAlert('Не выбран объект редактирования');return;}
 const schema=SCHEMA[ec.entity]||[];const fields={};
 for(const[key,,type]of schema){
  if(type==='statsgrid'){
   const obj={};document.querySelectorAll(`input[data-sg="${key}"]`).forEach(i=>{obj[i.dataset.k]=Number(i.value||0);});
   fields[key]=JSON.stringify(obj);continue;}
  const el=document.getElementById('ef_'+key);if(!el)continue;
  fields[key]=(type==='check')?(el.checked?1:0):el.value;}
 const r=await api('/api/ency/update',{entity:ec.entity,id:ec.id,fields});
 tg.showAlert(r.ok?'💾 Сохранено':'❌ '+(r.error||'ошибка'));await refresh();};
window.encGen=async()=>{
 const ec=editCtx||enc_sel; if(!ec)return;
 if(ec.entity==='hero'){const r=await api('/api/gen_hero_image',{});
  if(r.ok){IMG_V=Date.now();await refresh();}else{tg.showAlert('🎨 '+(r.error||'ошибка'));}return;}
 const g=GEN_MAP[ec.entity];if(!g)return;
 const r=await api('/api/gen_entity_image',{entity_type:g,id:ec.id});
 if(r.ok){IMG_V=Date.now();await refresh();}else{tg.showAlert('🎨 '+(r.error||'ошибка'));}};

async function editorHtml(entity,id){
 const g=await api('/api/ency/get',{entity,id});
 if(!g.ok)return card('❌','Запись не найдена');
 const rec=g.rec,schema=SCHEMA[entity]||[];
 let html=`<button class="btn ghost" onclick="${entity==='hero'?'heroEditToggle()':'encBack()'}">← Назад</button> <b style="margin-left:8px">${esc(rec.name||('#'+id))}</b>`;
 if(rec.image_media_id)html+=imgTag(rec.image_media_id,72);
 for(const[key,label,type,flag]of schema){
  const v=rec[key];
  if(type==='area'){html+=`<div class="muted">${label}</div><textarea id="ef_${key}" class="ta">${esc(v)}</textarea>`;
   if(flag==='img')html+=`<button class="btn ghost" onclick="trPrompt('${key}')">🇬🇧 В английский</button>`;}
  else if(type==='num'){html+=`<div class="row"><span>${label}</span><input id="ef_${key}" class="in" type="number" value="${esc(v)}"></div>`;}
  else if(type==='check'){html+=`<div class="row"><span>${label}</span><input id="ef_${key}" type="checkbox" ${v?'checked':''}></div>`;}
  else if(type==='statsgrid'){html+=statsGrid(key,typeof v==='string'?v:JSON.stringify(v||{}));}
  else{html+=`<div class="row"><span>${label}</span><input id="ef_${key}" class="in" style="width:150px" value="${esc(v)}"></div>`;}}
 html+=`<button class="btn" onclick="encSave()">💾 Сохранить</button>`;
 if(GEN_MAP[entity]||entity==='hero')html+=`<button class="btn ghost" onclick="encGen()">🎨 Картинка</button>`;
 if(UPLOADABLE.includes(entity))html+=`<label class="btn ghost" style="display:inline-block">📤 Загрузить<input type="file" accept="image/*" style="display:none" onchange="uploadEntity(this,'${entity}',${id})"></label>`;
 return html;
}

async function renderEnc(){
 let html=`<div class="tabs">`+ENC_TABS.map(t=>
  `<button class="${enc_sub===t.id&&!enc_sel&&!locSel?'active':''}" onclick="setEncSub('${t.id}')">${t.ic} ${t.t}</button>`).join('')+`</div>`;
 if(locSel){const l=locSel;
  html+=card(`🗺️ ${l.name}`,`${l.image?`<img src="${API_BASE||''}${thumbOf(l.image)}?v=${IMG_V}" onerror="this.onerror=null;this.src=this.src.replace('/thumbs/','')" style="width:100%;height:140px;object-fit:cover;border-radius:12px">`:'<div class="muted">Нет изображения</div>'}
   <div class="muted" style="margin:8px 0">${esc(l.desc||'')}</div>
   <h3 style="margin:6px 0 4px">Характеристики (влияют на всех внутри)</h3>${modsRows(l.effects)}
   <div style="margin-top:10px">
   ${l.current?'<div class="muted">📍 Вы здесь</div>':`<button class="btn" onclick="act('travel',{loc:${l.id}})">🚶 Переместиться туда</button>`}
   <button class="btn ghost" onclick="openEnc(${l.id})">✏️ Редактировать</button>
   <button class="btn ghost" onclick="closeLoc()">↩ Назад</button></div>`);
  return html;}
 if(enc_sel){return html+await editorHtml(enc_sel.entity,enc_sel.id);}
 const l=await api('/api/ency/list',{entity:enc_sub});const rows=l.rows||[];
 if(enc_sub==='location'&&rows.length){
  html+=rows.map(r=>`<div class="enc" onclick="openLoc(${r.id})">${imgTag(r.img,52)}<div class="t"><b>${esc(r.name)}</b></div><span class="muted">➡️</span></div>`).join('');
 }else if(enc_sub==='scenario'&&rows.length){
  html+=`<div class="enc" onclick="openEnc(${rows[0].id})"><div class="t"><b>🌍 ${esc(rows[0].name)}</b><div class="muted">Открыть информацию о мире</div></div></div>`;
 }else if(rows.length){
  html+=rows.map(r=>`<div class="enc" onclick="openEnc(${r.id})">${imgTag(r.img,52)}<div class="t"><b>${esc(r.name)}</b></div><span class="muted">✏️</span></div>`).join('');
 }else html+=card('📚','Раздел пуст.');
 return html;}

async function render(){
 document.getElementById('nav').innerHTML=NAV.map(t=>
  `<button class="${t.id===tab?'active':''}" onclick="setTab('${t.id}')"><span class="ic">${t.ic}</span>${t.t}</button>`).join('');
 const el=id=>document.getElementById(id);
 const ok=STATE&&STATE.ok;
 if(ok){const h=STATE.hero,sc=STATE.scenario;
  el('scen_name').textContent=sc.name||'LitRPG';
  el('hello').textContent=`Привет, ${(tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)||'Женя'}!`;
  el('hero_name').textContent=(h.name||'Герой')+' · '+(GENDER_RU[h.gender]||'Мужчина');
  el('hero_pos').textContent=h.position||'';
  if(sc.image)el('scen_bg').style.backgroundImage=`url(${API_BASE||''}${sc.image}?v=${IMG_V})`;
  if(h.image)el('hero_img').src=(API_BASE||'')+thumbOf(h.image)+'?v='+IMG_V;
  el('chips').innerHTML=`<span class="chip">⭐ Ур. ${h.level}</span><span class="chip">🪙 ${h.gold}</span><span class="chip">❤️ ${h.hp}/${h.max_hp}</span><span class="chip">🌍 ${sc.name}</span>`;
 }else{el('hero_name').textContent='';el('chips').innerHTML='<span class="chip">📡 Нет связи с игрой — бот и ngrok запущены?</span>';}
 let html='';
 if(tab==='home'){html='<div class="grid">'+MENU.map(m=>`<div class="item" onclick="setTab('${m.id}')"><div style="font-size:26px">${m.ic}</div><b>${m.t}</b><div class="muted">${m.d}</div></div>`).join('')+'</div>';}
 else if(!ok){html=card('⚠️ Меню недоступно','<div class="muted">Проверьте: бот запущен, ngrok поднят. При первом открытии нажмите «Visit Site».</div>');}
 else{const h=STATE.hero;
  if(tab==='hero'){
   if(heroEdit){html+=await editorHtml('hero',h.id);}
   else{
    html+=card('❤️ Здоровье',`${imgTag(h.image,64)}<div class="bar"><i style="width:${Math.round(h.hp/h.max_hp*100)}%"></i></div><div class="muted">${h.hp} / ${h.max_hp} · Репутация ${h.rep} · ${GENDER_RU[h.gender]||'Мужчина'}</div>`);
    html+=card('📊 Характеристики',Object.entries(h.stats).map(([k,v])=>`<div class="row"><span>${ru(k)}</span><b>${v}</b></div>`).join(''));
    html+=card('🛡 Экипировка (ячейки)',h.equipped.length?h.equipped.map(e=>`<div class="row"><span style="display:flex;gap:8px;align-items:center">${imgTag(e.img,36)} ${ru(e.slot)}: ${e.name}</span><button class="btn ghost" onclick="act('unequip',{slot:'${e.slot}'})">Снять</button></div>`).join(''):'<div class="muted">Пусто — откройте сумку 🎒</div>');
    html+=card('🎭 Внешность героя',`${imgTag(h.image,96)}
     <div class="muted">Промт внешности (EN)</div><textarea id="hero_prompt" class="ta">${esc(h.image_prompt||'')}</textarea>
     <button class="btn ghost" onclick="trHeroPrompt()">🇬🇧 В английский</button>
     <button class="btn" onclick="genHero()">🎨 Сгенерировать</button>
     <label class="btn ghost" style="display:inline-block">📤 Загрузить<input type="file" accept="image/*" style="display:none" onchange="uploadEntity(this,'hero',${h.id})"></label>
     <div style="margin-top:10px"><button class="btn ghost" onclick="heroEditToggle()">✏️ Имя, пол и роль</button></div>`);}
  }
  if(tab==='inv'){
   html=STATE.inventory.length?'<div class="grid">'+STATE.inventory.map(i=>
    `<div class="item" onclick="openItem(${i.inv})">${imgTag(i.img,40)}<div style="margin-top:6px"><b>${i.name}</b> <span class="muted">x${i.qty}</span></div><div class="muted">${ru(i.slot||'')} · ${QUAL_RU[i.quality]||''} ${i.equipped?'⚔️':''}</div></div>`).join('')+'</div>':card('🎒 Инвентарь','<div class="muted">Пусто</div>');
   if(itemSel){const i=itemSel;
    html+=card(`🎒 ${i.name}`,`${imgTag(i.img,96)}
     <div class="row"><span>Качество</span><b>${QUAL_RU[i.quality]||i.quality}</b></div>
     <div class="row"><span>Слот</span><b>${ru(i.slot||'—')}</b></div>
     <div class="row"><span>Редкость</span><b>${esc(i.rarity||'common')}</b></div>
     <div class="muted" style="margin:8px 0">${esc(i.desc||'Нет описания')}</div>
     <h3 style="margin:8px 0 4px">Параметры</h3>${modsRows(i.mods)}
     <div style="margin-top:10px">
     ${i.slot==='consumable'?`<button class="btn" onclick="act('use_item',{inv:${i.inv}})">Использовать</button>`:''}
     ${(i.slot&&i.slot!=='consumable'&&i.slot!=='quest')?(i.equipped?`<button class="btn ghost" onclick="act('unequip',{slot:'${i.slot}'})">Снять</button>`:`<button class="btn" onclick="act('equip',{inv:${i.inv}})">Надеть</button>`):''}
     <button class="btn ghost" onclick="closeItem()">↩ Назад</button></div>`);}
  }
  if(tab==='quests'){html=STATE.quests.length?STATE.quests.map(q=>card('📜 '+q.name,`<div class="muted">${(q.desc||'').slice(0,160)}</div><button class="btn ghost" onclick="act('quest_decline',{quest:${q.id}})">Отказаться</button>`)).join(''):card('📜 Квесты','<div class="muted">Нет активных квестов</div>');}
  if(tab==='map'){html=STATE.locations.map(l=>card(`${l.current?'📍 ':''}${l.safe?'🛡️ ':''}${l.name}`,`${imgTag(l.image,64)}<div class="muted">${(l.desc||'').slice(0,120)}</div><div class="muted">${Object.entries(l.effects||{}).map(([k,v])=>`${ru(k)} ${v}`).join(' · ')||'Без особенностей'}</div>`+(l.current?'<div class="muted">Вы здесь</div>':`<button class="btn" onclick="act('travel',{loc:${l.id}})">Переместиться</button>`))).join('')||card('🗺️ Карта','<div class="muted">Пусто</div>');}
  if(tab==='arbiter'){
   html=ARB_LOG.map(e=>`<div class="card"><div class="muted">Вы: ${esc(e.q)}</div><div style="margin-top:6px">${esc(e.a).replace(/\n/g,'<br>')}</div></div>`).join('');
   html+=`<div class="card"><textarea id="arb_in" class="ta" placeholder="Спроси Арбитра: создать локацию, NPC, расу, фракцию, эффект, предмет; изменить или удалить запись..."></textarea>
    <button class="btn" onclick="arbSend()">⚖️ Спросить Арбитра</button>
    <div class="muted" style="margin-top:6px">Арбитр правит БД напрямую. Ведущий и NPC НЕ знают об этом разговоре.</div></div>`;
  }
  if(tab==='ency'){html=await renderEnc();}
  if(tab==='worlds'){
   if(worldSel){const w=worldSel;
    html=card('🌍 '+w.name,`${w.image?`<img src="${API_BASE||''}${thumbOf(w.image)}?v=${IMG_V}" onerror="this.onerror=null;this.src=this.src.replace('/thumbs/','')" style="width:100%;height:140px;object-fit:cover;border-radius:12px">`:''}<div class="muted" style="margin:8px 0">${esc(w.desc||'')}</div>
     <div>
     ${w.active?'<div class="muted">✅ Активный мир</div>':`<button class="btn" onclick="act('switch',{scenario:${w.id}})">▶️ Сделать активным</button>`}
     <button class="btn danger" onclick="resetWorld(${w.id})">♻️ Сбросить всё</button>
     <button class="btn ghost" onclick="closeWorld()">↩ Назад в меню</button></div>`);}
   else html=STATE.scenarios.map(w=>`<div class="wcard" onclick="openWorld(${w.id})"><img src="${(API_BASE||'')+thumbOf(w.image||'avatar.jpg')}?v=${IMG_V}" onerror="this.onerror=null;this.src=this.src.replace('/thumbs/','')" style="width:100%;height:120px;object-fit:cover;background:#ffffff14"><b>${w.active?'✅ ':''}${w.name} (${w.genre})</b></div>`).join('');}
 }
 el('content').innerHTML=html;}
window.trHeroPrompt=async()=>{const el=document.getElementById('hero_prompt');if(!el)return;
 const r=await api('/api/translate',{text:el.value});if(r.ok){el.value=r.en;tg.showAlert('🇬🇧 Переведено');}};
window.genHero=async()=>{const el=document.getElementById('hero_prompt');
 if(el){const sav=await api('/api/ency/update',{entity:'hero',id:STATE.hero.id,fields:{image_prompt:el.value}});
  if(!sav.ok){tg.showAlert('Не удалось сохранить промт');}}
 const r=await api('/api/gen_hero_image',{});
 if(r.ok){IMG_V=Date.now();await refresh();}else{tg.showAlert('🎨 '+(r.error||'ошибка генерации'));}};
refresh();
</script>
</body>
</html>
