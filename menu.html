<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LitRPG Меню</title>
<style>
:root{--bg:#161226;--card:#221a38;--card2:#2a2145;--acc:#7c4dff;--acc2:#b388ff;
--txt:#f0ecff;--mut:#9a8fc0;--ok:#4caf50;--bad:#ef5350;--gold:#ffd54f}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--txt);padding-bottom:76px}
header{position:relative;height:172px;background:#4a2f8f center/cover no-repeat}
header::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,#161226)}
#avatar{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:92px;height:92px;
border-radius:50%;background:#8866cc center/cover no-repeat;border:3px solid #ffffff55;z-index:2}
#hname{position:absolute;top:112px;width:100%;text-align:center;font-weight:700;font-size:15px;z-index:2}
#chips{position:absolute;top:136px;width:100%;text-align:center;font-size:12px;color:#fff;z-index:2}
#chips span{background:#00000066;border-radius:10px;padding:2px 8px;margin:0 2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;
background:#0d0a18ee;border-top:1px solid #352a55;backdrop-filter:blur(6px);z-index:9}
nav button{flex:0 0 auto;padding:12px 10px;background:none;border:none;color:var(--mut);font-size:11px}
nav button.on{color:#fff;background:var(--acc);border-radius:10px 10px 0 0}
main{padding:10px;max-width:760px;margin:0 auto}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid #352a55;border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{font-size:14px;margin-bottom:6px;color:var(--acc2)}
.row{display:flex;gap:10px;align-items:center;margin:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px}
.mut{color:var(--mut);font-size:12px}
.btn{background:var(--acc);border:none;color:#fff;border-radius:10px;padding:9px 12px;margin:2px;font-size:13px}
.btn.sec{background:var(--card2);border:1px solid #352a55}
.btn.bad{background:var(--bad)}
input,select,textarea{width:100%;background:#191430;border:1px solid #352a55;border-radius:10px;
color:var(--txt);padding:9px;margin:4px 0;font-size:13px}
.sub{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
img.thumb{width:56px;height:56px;object-fit:cover;border-radius:10px;background:#332a55;flex:0 0 auto}
img.big{width:100%;border-radius:12px;margin:6px 0;background:#332a55}
.bar{height:8px;border-radius:4px;background:#332a55;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;background:var(--ok)}
#arblog{max-height:46vh;overflow-y:auto}
</style>
</head>
<body>
<header id="hdr"><div id="avatar"></div><div id="hname"></div><div id="chips"></div></header>
<main>
<section id="tab-home" class="on"></section>
<section id="tab-hero"></section>
<section id="tab-items"></section>
<section id="tab-map"></section>
<section id="tab-party"></section>
<section id="tab-time"></section>
<section id="tab-ency"></section>
<section id="tab-arb"></section>
<section id="tab-worlds"></section>
</main>
<nav id="nav"></nav>
<script>
const API = location.hostname.endsWith('github.io')
  ? 'https://unexpired-pogo-splotchy.ngrok-free.dev' : '';
const TG = window.Telegram ? window.Telegram.WebApp : null;
let S=null, ENC=null, EDIT=null;
const TABS=[['home','Домой'],['hero','Герой'],['items','Вещи'],['map','Карта'],
['party','Группа'],['time','Время'],['ency','Энцикл.'],['arb','Арбитр'],['worlds','Миры']];
const ENCY=[['scenario','Мир'],['location','Локации'],['npc_base','НПС Базовые'],
['npc_named','НПС с Именем'],['item','Предметы'],['cskill','Боевые ум.'],
['nskill','Мирные ум.'],['effect','Эффекты'],['race','Расы'],['faction','Фракции']];
const STAT_RU={strength:'Сила',magic_power:'Маг. сила',intelligence:'Интеллект',
health:'Здоровье',max_health:'Макс. здоровье',speed:'Скорость',armor:'Броня',
luck:'Удача',charisma:'Харизма',crit_chance_phys:'Крит физ %',crit_multiplier_phys:'Крит физ ×',
crit_chance_mag:'Крит маг %',crit_multiplier_mag:'Крит маг ×',perception:'Восприятие'};
const SLOT_RU={hand:'Оружие',head:'Голова',body:'Тело',legs:'Ноги',feet:'Ступни',
accessory:'Аксессуар',consumable:'Расходник',quest:'Квестовый'};
const RAR_RU={common:'Обычный',uncommon:'Необычный',rare:'Редкий',epic:'Эпический',legendary:'Легендарный'};
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
async function api(p,b){const r=await fetch(API+p,{method:'POST',
 headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},
 body:JSON.stringify(Object.assign({init_data:TG?TG.initData:''},b||{}))});return r.json();}
async function blobInto(img,path){if(!path){img.style.visibility='hidden';return;}
 try{const r=await fetch(API+path+'?v='+Date.now(),{headers:{'ngrok-skip-browser-warning':'1'}});
 const b=await r.blob();img.src=URL.createObjectURL(b);img.style.visibility='visible';}
 catch(e){img.style.visibility='hidden';}}
function thumb(path){const i=document.createElement('img');i.className='thumb';blobInto(i,path);return i;}
function bar(hp,mx){const p=mx?Math.max(0,Math.min(100,hp*100/mx)):0;
 return `<div class="bar"><i style="width:${p}%"></i></div><span class="mut">${hp}/${mx}</span>`;}
function tabs(){$('nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');
 $('nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('main section').forEach(s=>s.classList.toggle('on',s.id==='tab-'+t));
  if(t==='time')loadTime(); if(t==='ency')loadEncy(); if(t==='arb')renderArb();};
 document.querySelector('nav button').classList.add('on');}
function header(){const h=S.hero,sc=S.scenario;
 blobInto($('hdr'),sc.image);blobInto($('avatar'),h.image);
 $('hname').textContent=`${h.name} · ${h.gender==='female'?'Женщина':'Мужчина'} · ${h.position||''}`;
 $('chips').innerHTML=`<span>⭐ Ур. ${h.level}</span><span>💰 ${h.gold}</span>`+
  `<span>❤️ ${h.hp}/${h.max_hp}</span><span>🌍 ${sc.name}</span>`;}
function renderHome(){const sc=S.scenario;
 $('tab-home').innerHTML=`<div class="card"><h3>${esc(sc.name)}</h3>
 <div class="mut">${esc(sc.genre||'')}</div><p style="margin-top:6px">${esc(sc.desc||'')}</p></div>
 <div class="card"><h3>События</h3>${(S.events||[]).map(e=>
  `<div class="row">• ${esc(e.name)} <span class="mut">${esc(e.status)}</span></div>`).join('')
  ||'<div class="mut">Нет активных событий</div>'}</div>`;}
function renderHero(){const h=S.hero;
 const stats=Object.entries(h.stats||{}).map(([k,v])=>
  `<div>${STAT_RU[k]||k}: <b>${v}</b></div>`).join('');
 const eq=(h.equipped||[]).map(e=>`<div class="row" data-eq="${e.slot}"></div>`).join('')
  ||'<div class="mut">Ничего не надето</div>';
 $('tab-hero').innerHTML=`<div class="card"><h3>Характеристики</h3>
  <div class="grid2">${stats}</div>
  <button class="btn sec" onclick="heroEdit('stats')">✏️ Изменить статы</button></div>
 <div class="card"><h3>Экипировка</h3><div id="eqlist">${eq}</div></div>
 <div class="card"><h3>Внешность</h3><div id="heroimg"></div>
  <div class="mut" id="heroprompt">${esc(h.image_prompt||'')}</div>
  <button class="btn" onclick="genHero()">🎨 Сгенерировать</button>
  <button class="btn sec" onclick="heroEdit('look')">✏️ Изменить промт</button>
  <label class="btn sec" style="display:inline-block">📤 Загрузить
   <input type="file" hidden accept="image/*" onchange="upHero(this)"></label></div>
 <div class="card"><h3>Профиль</h3>
  <div>Имя: <b>${esc(h.name)}</b> · Пол: <b>${h.gender==='female'?'Ж':'М'}</b></div>
  <div class="mut">${esc(h.position||'')}</div>
  <button class="btn sec" onclick="heroEdit('profile')">✏️ Имя, пол и роль</button></div>`;
 (h.equipped||[]).forEach(e=>{const row=document.querySelector(`[data-eq="${e.slot}"]`);
  if(row){row.appendChild(thumb(e.img));
   row.insertAdjacentHTML('beforeend',
    `<div><b>${esc(SLOT_RU[e.slot]||e.slot)}</b>: ${esc(e.name)}</div>`);}});
 const bi=document.createElement('img');bi.className='big';blobInto(bi,h.image);
 $('heroimg').appendChild(bi);}
async function heroEdit(mode){const h=S.hero;let html='';
 if(mode==='profile')html=`<label class="mut">Имя</label><input id="e_name" value="${esc(h.name)}">
  <label class="mut">Пол</label><select id="e_gender">
   <option value="male" ${h.gender==='male'?'selected':''}>Мужской</option>
   <option value="female" ${h.gender==='female'?'selected':''}>Женский</option></select>
  <label class="mut">Должность</label><input id="e_position" value="${esc(h.position||'')}">`;
 if(mode==='stats')html=Object.entries(h.stats||{}).map(([k,v])=>
  `<label class="mut">${STAT_RU[k]||k}</label><input type="number" data-f="${k}" value="${v}">`).join('');
 if(mode==='look')html=`<label class="mut">Промт внешности (EN)</label>
  <textarea id="e_prompt" rows="3">${esc(h.image_prompt||'')}</textarea>`;
 $('tab-hero').insertAdjacentHTML('afterbegin',
  `<div class="card" id="editbox"><h3>✏️ Редактор</h3>${html}
   <button class="btn" onclick="heroSave('${mode}')">💾 Сохранить</button>
   <button class="btn sec" onclick="$('editbox').remove()">↩ Отмена</button></div>`);}
async function heroSave(mode){const h=S.hero;const f={};
 if(mode==='profile'){f.name=$('e_name').value;f.gender=$('e_gender').value;
  f.position=$('e_position').value;}
 if(mode==='look'){f.image_prompt=$('e_prompt').value;}
 if(mode==='stats'){document.querySelectorAll('#editbox [data-f]')
  .forEach(i=>f[i.dataset.f]=+i.value);}
 await api('/api/ency/update',{entity:'hero',id:h.id,fields:f});
 $('editbox')&&$('editbox').remove();load();}
async function genHero(){await api('/api/gen_hero_image',{});load();}
async function upHero(inp){const f=inp.files[0];if(!f)return;const fd=new FormData();
 fd.append('file',f);await fetch(API+`/api/upload_entity_image?entity=hero&id=${S.hero.id}`,
  {method:'POST',body:fd,headers:{'ngrok-skip-browser-warning':'1'}});load();}
function renderItems(){$('tab-items').innerHTML=(S.inventory||[]).map(i=>
 `<div class="card"><div class="row" data-img="${i.img}"></div>
  <div class="mut">слот: ${SLOT_RU[i.slot]||i.slot} · качество ${i.quality} ·
   ${RAR_RU[i.rarity]||i.rarity} · ×${i.qty}</div>
  <div class="mut">${esc(i.desc||'')}</div>
  <div class="grid2">${Object.entries(i.mods||{}).map(([k,v])=>
   `<div>${STAT_RU[k]||k}: <b>${v}</b></div>`).join('')}</div>
  ${i.slot==='consumable'?`<button class="btn" onclick="act('use_item',{inv:${i.inv}})">Использовать</button>`:''}
  ${['consumable','quest'].includes(i.slot)?'':
   (i.equipped?`<button class="btn sec" onclick="act('unequip',{slot:'${i.slot}'})">Снять</button>`
    :`<button class="btn" onclick="act('equip',{inv:${i.inv}})">Надеть</button>`)}</div>`).join('')
 ||'<div class="card mut">Инвентарь пуст</div>';
 (S.inventory||[]).forEach((i,idx)=>{const row=document.querySelectorAll('#tab-items [data-img]')[idx];
  if(row){row.appendChild(thumb(i.img));
   row.insertAdjacentHTML('beforeend',`<div><b>${esc(i.name)}</b></div>`);}});}
function renderMap(){$('tab-map').innerHTML=(S.locations||[]).map(l=>
 `<div class="card"><div class="row" data-img="${l.image}"></div>
  <div class="mut">${esc((l.desc||'').slice(0,140))}</div>
  ${Object.entries(l.effects||{}).map(([k,v])=>
   `<span class="mut">${STAT_RU[k]||k} ${v>0?'+':''}${v}% </span>`).join('')}
  ${l.current?'<div class="mut">📍 Ты здесь</div>':
   `<button class="btn" onclick="act('travel',{loc:${l.id}})">🚶 Переместиться</button>`}
  <button class="btn sec" onclick="openEncy('location',${l.id})">✏️ Редактировать</button></div>`).join('');
 (S.locations||[]).forEach((l,idx)=>{const row=document.querySelectorAll('#tab-map [data-img]')[idx];
  if(row){row.appendChild(thumb(l.image));
   row.insertAdjacentHTML('beforeend',
    `<div><b>${esc(l.name)}</b> ${l.current?'📍':''}${l.safe?'🛡️':''}</div>`);}});}
function renderParty(){const p=S.party||[];
 $('tab-party').innerHTML=`<div class="card"><h3>👥 Группа (${p.length}/10)</h3>
 ${p.map(n=>`<div class="row"><div style="flex:1"><b>${esc(n.name)}</b>
  <span class="mut">ур.${n.level} · ${esc(n.race||'')}</span>${bar(n.hp,n.max_hp)}</div>
  <button class="btn sec" onclick="kick(${n.id})">Исключить</button></div>`).join('')
  ||'<div class="mut">Группа пуста. Добавь в чате: «возьми X в группу» или /party add &lt;id&gt;</div>'}</div>`;}
async function kick(id){if(!confirm('Исключить из группы?'))return;
 await api('/api/ency/update',{entity:'npc_named',id,fields:{is_in_party:0}});
 await api('/api/ency/update',{entity:'npc_base',id,fields:{is_in_party:0}});load();}
async function loadTime(){const t=await api('/api/time',{});
 const mod=t.minute_of_day!=null?t.minute_of_day:480;
 const ev=Math.max(5,1080-mod),ni=Math.max(5,1320-mod),mo=(1440-mod)+480;
 $('tab-time').innerHTML=`<div class="card"><h3>⏰ Время</h3>
  <div>${esc(t.date||t.game_date||'')} · <b>${esc(t.time||'')}</b></div>
  <div class="mut">Сезон: ${esc(t.season||'')} · Погода: ${esc(t.weather||'')} ·
   ${t.temperature_c!=null?t.temperature_c+'°C':''}</div>
  <button class="btn sec" onclick="adv(30)">+30 мин</button>
  <button class="btn sec" onclick="adv(60)">+1 час</button>
  <button class="btn sec" onclick="adv(180)">+3 часа</button>
  <button class="btn" onclick="adv(${ev})">Сегодня вечер</button>
  <button class="btn" onclick="adv(${ni})">Сегодня ночь</button>
  <button class="btn" onclick="adv(${mo})">Завтра утро</button>
  <label class="mut">Точная перемотка (минут)</label>
  <input id="tmin" type="number" placeholder="Например 240">
  <button class="btn" onclick="adv(+$('tmin').value||0)">⌨️ Перемотать</button></div>`;}
async function adv(m){if(!m)return;await api('/api/advance_time',{minutes:m});
 alert('⏩ Время перемотано');load();loadTime();}
let encyCur='npc_named';
async function loadEncy(sub){if(sub)encyCur=sub;
 $('tab-ency').innerHTML=`<div class="sub">${ENCY.map(e=>
  `<button class="btn ${e[0]===encyCur?'':'sec'}" onclick="loadEncy('${e[0]}')">${e[1]}</button>`).join('')}</div>
  <div id="encylist"></div><div id="encycard"></div>`;
 const r=await api('/api/ency/list',{entity:encyCur});
 $('encylist').innerHTML=(r.rows||[]).map(x=>
  `<div class="card"><div class="row" data-img="${x.img}"></div>
   <button class="btn sec" onclick="openEncy('${encyCur}',${x.id})">✏️ Изменить</button></div>`).join('')
  ||'<div class="card mut">Пусто</div>';
 (r.rows||[]).forEach((x,idx)=>{const row=document.querySelectorAll('#encylist [data-img]')[idx];
  if(row){row.appendChild(thumb(x.img));
   row.insertAdjacentHTML('beforeend',`<div><b>${esc(x.name)}</b></div>`);}});}
async function openEncy(entity,id){const r=await api('/api/ency/get',{entity,id});
 if(!r.ok)return;EDIT={entity,id,rec:r.rec};renderEncyCard(r.rec);}
function renderEncyCard(rec){const skip=new Set(['image_media_id']);
 const rows=Object.entries(rec).filter(([k,v])=>!skip.has(k)&&v!=null&&v!=='')
  .map(([k,v])=>`<div class="mut">${k}: <b style="color:var(--txt)">${esc(String(v).slice(0,120))}</b></div>`).join('');
 $('encycard').innerHTML=`<div class="card"><h3>✏️ ${esc(rec.name||('#'+EDIT.id))}</h3>
  <div id="encimg"></div>${rows}
  <button class="btn" onclick="encyEdit()">✏️ Изменить</button>
  <button class="btn sec" onclick="encyGen()">🎨 Картинка</button>
  <label class="btn sec" style="display:inline-block">📤 Загрузить
   <input type="file" hidden accept="image/*" onchange="encyUp(this)"></label>
  <button class="btn sec" onclick="$('encycard').innerHTML=''">↩ Закрыть</button></div>`;
 const bi=document.createElement('img');bi.className='big';blobInto(bi,rec.image_media_id);
 $('encimg').appendChild(bi);}
function encyEdit(){const rec=EDIT.rec;
 const skip=new Set(['npc_id','item_id','location_id','scenario_id','hero_id','race_id',
  'faction_id','effect_id','combat_skill_id','noncombat_skill_id','image_media_id']);
 $('encycard').insertAdjacentHTML('afterbegin',`<div class="card" id="encedit">
  <h3>Редактор полей</h3>${Object.entries(rec).filter(([k])=>!skip.has(k)).map(([k,v])=>{
   const val=v==null?'':(typeof v==='object'?JSON.stringify(v):String(v));
   return `<label class="mut">${k}</label>`+(val.length>60?
    `<textarea data-f="${k}" rows="2">${esc(val)}</textarea>`:
    `<input data-f="${k}" value="${esc(val)}">`);}).join('')}
  <button class="btn" onclick="encySave()">💾 Сохранить</button>
  <button class="btn sec" onclick="$('encedit').remove()">↩ Отмена</button></div>`);}
async function encySave(){const f={};
 document.querySelectorAll('#encedit [data-f]').forEach(i=>f[i.dataset.f]=i.value);
 await api('/api/ency/update',{entity:EDIT.entity,id:EDIT.id,fields:f});
 $('encedit').remove();loadEncy();openEncy(EDIT.entity,EDIT.id);}
async function encyGen(){const t={npc_base:'npc',npc_named:'npc',item:'item',
 location:'location',scenario:'scenario'}[EDIT.entity];if(!t)return;
 await api('/api/gen_entity_image',{entity_type:t,id:EDIT.id});openEncy(EDIT.entity,EDIT.id);}
async function encyUp(inp){const f=inp.files[0];if(!f)return;const fd=new FormData();
 fd.append('file',f);const t={npc_base:'npc',npc_named:'npc'}[EDIT.entity]||EDIT.entity;
 await fetch(API+`/api/upload_entity_image?entity=${t}&id=${EDIT.id}`,
  {method:'POST',body:fd,headers:{'ngrok-skip-browser-warning':'1'}});
 openEncy(EDIT.entity,EDIT.id);}
function renderArb(){$('tab-arb').innerHTML=`<div class="card"><h3>⚖️ Арбитр</h3>
 <div id="arblog"></div><div class="row"><input id="arbin" placeholder="Вопрос или правка мира...">
 <button class="btn" onclick="sendArb()">➤</button></div></div>`;}
async function sendArb(){const txt=$('arbin').value;if(!txt)return;
 $('arblog').insertAdjacentHTML('beforeend',`<div class="card"><b>Ты:</b> ${esc(txt)}</div>`);
 $('arbin').value='';const r=await api('/api/arbiter',{text:txt});
 $('arblog').insertAdjacentHTML('beforeend',
  `<div class="card"><b>Арбитр:</b> ${esc(r.reply||r.error||'')}</div>`);
 $('arblog').scrollTop=1e6;}
function renderWorlds(){$('tab-worlds').innerHTML=(S.scenarios||[]).map(w=>
 `<div class="card"><div class="row" data-img="${w.image}"></div>
  <div class="mut">${esc(w.genre||'')}</div>
  ${w.active?'<div class="mut">✅ Активен</div>':
   `<button class="btn" onclick="act('switch',{scenario:${w.id}})">Сделать активным</button>`}
  <button class="btn bad" onclick="resetWorld(${w.id})">♻️ Сбросить всё</button></div>`).join('');
 (S.scenarios||[]).forEach((w,idx)=>{const row=document.querySelectorAll('#tab-worlds [data-img]')[idx];
  if(row){row.appendChild(thumb(w.image));
   row.insertAdjacentHTML('beforeend',`<div><b>${esc(w.name)}</b></div>`);}});}
async function resetWorld(id){if(!confirm('Сбросить мир? Прогресс героя и именные NPC будут удалены.'))return;
 await fetch(API+'/api/reset_world',{method:'POST',
  headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},
  body:JSON.stringify({init_data:TG?TG.initData:'',scenario_id:id})});
 alert('♻️ Мир сброшен');load();}
async function act(a,p){const r=await api('/api/menu/action',{action:a,params:p});
 if(r&&r.error)alert('❌ '+r.error);load();}
async function load(){S=await api('/api/menu/state',{});if(!S.ok)return;
 header();renderHome();renderHero();renderItems();renderMap();renderParty();renderWorlds();}
tabs();load();
</script>
</body>
</html>
