<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LitRPG Меню</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0e0b16;--card:#1a1626;--accent:#7c4dff;--accent2:#b388ff;--text:#f3efff;--muted:#8a80a0}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);padding-bottom:80px}
header{position:relative;background:linear-gradient(180deg,#7c4dff,#4a2b8f);padding:22px 16px 46px;text-align:center;border-radius:0 0 24px 24px;overflow:hidden}
header .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.25;filter:blur(2px)}
header .inner{position:relative}
.avatar{width:82px;height:82px;border-radius:50%;overflow:hidden;margin:0 auto 10px;border:2px solid #ffffff55;background:#ffffff22}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:20px}
.sub{font-size:12px;opacity:.85;margin-top:4px}
.chips{display:flex;gap:7px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.chip{background:#00000044;border-radius:20px;padding:6px 12px;font-size:12px}
nav{position:fixed;bottom:10px;left:10px;right:10px;background:#241d33f2;border-radius:20px;display:flex;justify-content:space-around;padding:7px 2px;backdrop-filter:blur(8px);box-shadow:0 6px 20px #00000088}
nav button{background:none;border:none;color:var(--muted);font-size:9px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 4px;border-radius:12px}
nav button .ic{font-size:18px}
nav button.active{color:var(--accent2);background:#7c4dff22}
section{padding:14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #ffffff0d;font-size:14px}
.row:last-child{border:none}
.btn{background:var(--accent);border:none;color:#fff;border-radius:12px;padding:8px 13px;font-size:13px;margin:4px 4px 0 0}
.btn.ghost{background:#ffffff14}
.bar{height:8px;border-radius:4px;background:#ffffff14;margin:4px 0}
.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:#ffffff0d;border-radius:12px;padding:12px;font-size:13px;cursor:pointer}
.item:active{background:#ffffff1a}
.muted{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:#ffffff0d;border:none;color:var(--muted);border-radius:12px;padding:8px 8px;font-size:11px}
.tabs button.active{background:var(--accent);color:#fff}
.ta{width:100%;min-height:70px;background:#ffffff0d;border:1px solid #ffffff14;border-radius:10px;color:var(--text);padding:8px;font-size:13px;margin:4px 0}
.in{background:#ffffff0d;border:1px solid #ffffff14;border-radius:10px;color:var(--text);padding:6px 8px;width:110px;font-size:13px}
.enc{display:flex;gap:10px;align-items:center;background:#ffffff0d;border-radius:12px;padding:10px;margin-bottom:10px;cursor:pointer}
.enc img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#ffffff14}
.enc .t{flex:1}
</style>
</head>
<body>
<header>
  <div class="bg" id="scen_bg"></div>
  <div class="inner">
    <div class="avatar"><img id="scen_img" src="avatar.jpg" alt=""></div>
    <h1 id="scen_name">LitRPG</h1>
    <div class="sub" id="hello"></div>
    <div class="chips" id="chips"></div>
  </div>
</header>
<section id="content"></section>
<nav id="nav"></nav>
<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const INIT = tg.initData;
// КЛЮЧЕВОЕ: вне GitHub Pages все запросы идут в СВОЙ домен (same-origin, без CORS)
const NGROK = 'https://unexpired-pogo-splotchy.ngrok-free.dev';
const API_BASE = location.hostname.endsWith('github.io') ? NGROK : '';
let STATE = null, tab = 'home';
let enc_sub = 'scenario', enc_sel = null;

const NAV = [
  {id:'home',ic:'🏠',t:'Домой'},{id:'hero',ic:'👤',t:'Герой'},{id:'inv',ic:'🎒',t:'Вещи'},
  {id:'map',ic:'🗺️',t:'Карта'},{id:'ency',ic:'📚',t:'Энцикл.'},{id:'worlds',ic:'🌍',t:'Миры'}
];
const MENU = [
  {id:'hero',ic:'👤',t:'Персонаж',d:'Статы, эффекты, экипировка'},
  {id:'inv',ic:'🎒',t:'Инвентарь',d:'Вещи: использовать / надеть'},
  {id:'quests',ic:'📜',t:'Квесты',d:'Активные квесты'},
  {id:'map',ic:'🗺️',t:'Карта',d:'Локации и перемещение'},
  {id:'combat',ic:'⚔️',t:'Бой',d:'Тактика автобоя'},
  {id:'events',ic:'📖',t:'События',d:'Сюжетная цепочка'},
  {id:'ency',ic:'📚',t:'Энциклопедия',d:'Мир, NPC, предметы, умения — правка БД'},
  {id:'worlds',ic:'🌍',t:'Миры',d:'Переключить сценарий'}
];
const TACTICS = {balanced:'⚖ Сбаланс.',aggressive:'🗡 Агрессивная',defensive:'🛡 Защитная',support:'💠 Поддержка'};

const ENC_TABS = [
  {id:'scenario',ic:'🌍',t:'Мир'},{id:'location',ic:'🗺️',t:'Локации'},{id:'npc',ic:'👥',t:'NPC'},
  {id:'item',ic:'🎒',t:'Предметы'},{id:'cskill',ic:'⚔️',t:'Боевые ум.'},{id:'nskill',ic:'✨',t:'Мирные ум.'},
  {id:'effect',ic:'🧪',t:'Эффекты'},{id:'faction',ic:'🏰',t:'Фракции'}
];
const SCHEMA = {
  scenario: [['name','Название','text'],['genre','Жанр','text'],
    ['description','Описание мира','area'],['greeting','Приветствие','area'],
    ['image_prompt','Промт вида (EN)','area','img']],
  location: [['name','Название','text'],['description','Описание','area'],
    ['image_prompt','Промт вида (EN)','area','img'],['is_safe','Безопасная (точка возрождения)','check']],
  npc: [['name','Имя','text'],['race','Раса','text'],['npc_type','Тип (base/named)','text'],
    ['position','Должность','text'],['role_description','Роль в мире','area'],
    ['image_prompt','Промт вида (EN)','area','img'],
    ['mood','Настроение 0–100','num'],['affection','Привязанность 0–100','num'],
    ['intimacy','Раскрепощённость 0–100','num'],['reputation','Репутация 0–100','num'],
    ['is_merchant','Торговец','check'],['is_immortal','Бессмертный','check'],
    ['ability_craft','Ремесло (крафт)','text'],
    ['base_stats','Базовые статы (JSON)','area'],['effective_stats','Эффективные статы (JSON)','area']],
  item: [['name','Название','text'],['quality','Качество 1–6','num'],['slot','Слот','text'],
    ['rarity','Редкость (common/rare/epic)','text'],['price','Цена','num'],
    ['revealing_level','Открытость 0–5','num'],['action','Действие (equip/use)','text'],
    ['description','Описание','area'],['image_prompt','Промт вида (EN)','area','img'],
    ['base_stat_modifiers','Модификаторы (JSON)','area']],
  cskill: [['name','Название','text'],['description','Описание','area'],
    ['damage_type','Тип (physical/magical)','text'],['base_damage','Урон','num'],
    ['cooldown','Кулдаун (ходов)','num'],['speed_bonus','Бонус скорости','num']],
  nskill: [['name','Название','text'],['description','Описание','area'],
    ['stat_modifiers','Модификаторы (JSON)','area'],['duration_days','Длительность (сутки)','num']],
  effect: [['name','Название','text'],['description','Описание','area'],
    ['stat_modifiers','Модификаторы (JSON)','area'],['power_grade','Сила −5…+5','num'],
    ['duration_type','Тип (battle/days)','text'],['duration_value','Значение','num']],
  faction: [['name','Название','text'],['description','Описание','area'],['reputation','Репутация 0–100','num']]
};
const GEN_MAP = {scenario:'scenario', location:'location', npc:'npc', item:'item'};

async function api(path, body={}){
  try{
    const r = await fetch(API_BASE + path, {method:'POST',
      headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'true'},
      body: JSON.stringify({init_data: INIT, ...body})});
    return await r.json();
  }catch(e){ return {ok:false, error:'network'}; }
}
async function refresh(){ STATE = await api('/api/menu/state'); await render(); }
window.setTab = async id => { tab=id; enc_sel=null; await render(); };
window.setEncSub = async id => { enc_sub=id; enc_sel=null; await render(); };
window.openEnc = async id => { enc_sel={entity:enc_sub, id}; await render(); };
window.encBack = async () => { enc_sel=null; await render(); };
window.act = async (a,p={}) => { await api('/api/menu/action',{action:a,params:p}); await refresh(); };
window.genImg = async (type,id) => {
  const r = await api('/api/gen_entity_image',{entity_type:type,id});
  if(r.ok){ await refresh(); } else { tg.showAlert('🎨 ' + (r.error||'ошибка генерации')); }
};
const card=(t,b)=>`<div class="card"><h3>${t}</h3>${b}</div>`;
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const img=(src)=>src?`<img src="${API_BASE||''}${src}">`:`<img src="avatar.jpg" style="opacity:.3">`;

window.trPrompt = async key => {
  const el = document.getElementById('ef_'+key); if(!el) return;
  const r = await api('/api/translate',{text: el.value});
  if(r.ok){ el.value = r.en; tg.showAlert('🇬🇧 Переведено на английский'); }
};
window.encSave = async () => {
  const schema = SCHEMA[enc_sel.entity]||[];
  const fields = {};
  for(const [key,,type] of schema){
    const el = document.getElementById('ef_'+key); if(!el) continue;
    let v = (type==='check') ? (el.checked?1:0) : el.value;
    if(type==='area' && (key.includes('modif') || key.includes('stats'))){
      try{ JSON.parse(v||'{}'); }catch(e){ tg.showAlert('❌ JSON некорректен: '+key); return; }
    }
    fields[key]=v;
  }
  const r = await api('/api/ency/update',{entity:enc_sel.entity,id:enc_sel.id,fields});
  tg.showAlert(r.ok?'💾 Сохранено':'❌ '+(r.error||'ошибка'));
  await render();
};
window.encGen = async () => {
  const g = GEN_MAP[enc_sel.entity]; if(!g) return;
  const r = await api('/api/gen_entity_image',{entity_type:g,id:enc_sel.id});
  if(r.ok){ await render(); } else { tg.showAlert('🎨 '+(r.error||'ошибка')); }
};

async function renderEnc(){
  let html = `<div class="tabs">` + ENC_TABS.map(t=>
    `<button class="${enc_sub===t.id&&!enc_sel?'active':''}" onclick="setEncSub('${t.id}')">${t.ic} ${t.t}</button>`).join('') + `</div>`;
  if(enc_sel){
    const g = await api('/api/ency/get',{entity:enc_sel.entity,id:enc_sel.id});
    if(!g.ok) return html + card('❌','Запись не найдена');
    const rec = g.rec, schema = SCHEMA[enc_sel.entity]||[];
    html += `<button class="btn ghost" onclick="encBack()">← К списку</button>
             <b style="margin-left:8px">${esc(rec.name||('#'+enc_sel.id))}</b>
             ${rec.image_media_id?`<img src="${API_BASE||''}${rec.image_media_id}" style="width:52px;height:52px;border-radius:10px;object-fit:cover;float:right">`:''}`;
    for(const [key,label,type,flag] of schema){
      const v = rec[key];
      if(type==='area'){
        html += `<div class="muted">${label}</div><textarea id="ef_${key}" class="ta">${esc(v)}</textarea>`;
        if(flag==='img') html += `<button class="btn ghost" onclick="trPrompt('${key}')">🇬🇧 В английский</button>`;
      } else if(type==='num'){
        html += `<div class="row"><span>${label}</span><input id="ef_${key}" class="in" type="number" value="${esc(v)}"></div>`;
      } else if(type==='check'){
        html += `<div class="row"><span>${label}</span><input id="ef_${key}" type="checkbox" ${v?'checked':''}></div>`;
      } else {
        html += `<div class="row"><span>${label}</span><input id="ef_${key}" class="in" style="width:150px" value="${esc(v)}"></div>`;
      }
    }
    html += `<button class="btn" onclick="encSave()">💾 Сохранить</button>`;
    if(GEN_MAP[enc_sel.entity]) html += `<button class="btn ghost" onclick="encGen()">🎨 Картинка (EN-промт)</button>`;
  } else {
    const l = await api('/api/ency/list',{entity:enc_sub});
    const rows = l.rows||[];
    if(enc_sub==='scenario' && rows.length){
      html += `<div class="enc" onclick="openEnc(${rows[0].id})"><div class="t"><b>🌍 ${esc(rows[0].name)}</b><div class="muted">Открыть информацию о мире</div></div></div>`;
    } else if(rows.length){
      html += rows.map(r=>`<div class="enc" onclick="openEnc(${r.id})"><div class="t"><b>${esc(r.name)}</b></div><span class="muted">✏️</span></div>`).join('');
    } else {
      html += card('📚','Раздел пуст.');
    }
  }
  return html;
}

async function render(){
  document.getElementById('nav').innerHTML =
    NAV.map(t=>`<button class="${t.id===tab?'active':''}" onclick="setTab('${t.id}')"><span class="ic">${t.ic}</span>${t.t}</button>`).join('');
  const el = id => document.getElementById(id);
  const ok = STATE && STATE.ok;
  if(ok){
    const h = STATE.hero, sc = STATE.scenario;
    el('scen_name').textContent = sc.name || 'LitRPG';
    el('hello').textContent = `Привет, ${(tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)||'Женя'}!`;
    if(sc.image){ el('scen_img').src = (API_BASE||'') + sc.image; el('scen_bg').style.backgroundImage = `url(${API_BASE||''}${sc.image})`; }
    el('chips').innerHTML =
      `<span class="chip">⭐ Ур. ${h.level}</span><span class="chip">🪙 ${h.gold}</span>`+
      `<span class="chip">❤️ ${h.hp}/${h.max_hp}</span><span class="chip">🌍 ${sc.name}</span>`;
  } else {
    el('chips').innerHTML = '<span class="chip">📡 Нет связи с игрой — бот и ngrok запущены?</span>';
  }
  let html = '';
  if(tab==='home'){
    html = '<div class="grid">' + MENU.map(m=>
      `<div class="item" onclick="setTab('${m.id}')"><div style="font-size:26px">${m.ic}</div><b>${m.t}</b><div class="muted">${m.d}</div></div>`).join('') + '</div>';
  } else if(!ok){
    html = card('⚠️ Меню недоступно','<div class="muted">Проверьте: бот запущен, ngrok поднят. При первом открытии нажмите «Visit Site» на странице ngrok.</div>');
  } else {
    const h = STATE.hero;
    if(tab==='hero'){
      html += card('❤️ Здоровье', `<div class="bar"><i style="width:${Math.round(h.hp/h.max_hp*100)}%"></i></div><div class="muted">${h.hp} / ${h.max_hp} · Репутация ${h.rep}</div>`);
      html += card('📊 Статы', Object.entries(h.stats).map(([k,v])=>`<div class="row"><span>${k}</span><b>${v}</b></div>`).join(''));
      html += card('🛡 Экипировка (ячейки)', Object.keys(h.equipped).length
        ? Object.entries(h.equipped).map(([s,n])=>`<div class="row"><span>${s}: ${n}</span><button class="btn ghost" onclick="act('unequip',{slot:'${s}'})">Снять</button></div>`).join('')
        : '<div class="muted">Пусто — откройте сумку 🎒</div>');
    }
    if(tab==='inv'){
      html = STATE.inventory.length ? '<div class="grid">' + STATE.inventory.map(i=>
        `<div class="item"><b>${i.name}</b> <span class="muted">x${i.qty}</span><div class="muted">${i.slot||''} ${i.equipped?'⚔️':''}</div>`+
        (i.slot==='consumable'?`<button class="btn" onclick="act('use_item',{inv:${i.inv}})">Исп.</button>`:'')+
        ((i.slot&&i.slot!=='consumable'&&i.slot!=='quest')?`<button class="btn ghost" onclick="act('equip',{inv:${i.inv}})">Надеть</button>`:'')+
        `</div>`).join('') + '</div>' : card('🎒 Инвентарь','<div class="muted">Пусто</div>');
    }
    if(tab==='quests'){
      html = STATE.quests.length ? STATE.quests.map(q=>card('📜 '+q.name,
        `<div class="muted">${(q.desc||'').slice(0,160)}</div><button class="btn ghost" onclick="act('quest_decline',{quest:${q.id}})">Отказаться</button>`)).join('')
        : card('📜 Квесты','<div class="muted">Нет активных квестов</div>');
    }
    if(tab==='map'){
      html = STATE.locations.map(l=>card(`${l.current?'📍 ':''}${l.safe?'🛡️ ':''}${l.name}`,
        `<div class="muted">${(l.desc||'').slice(0,120)}</div>`+
        (l.current?'<div class="muted">Вы здесь</div>':`<button class="btn" onclick="act('travel',{loc:${l.id}})">Переместиться</button>`))).join('')
        || card('🗺️ Карта','<div class="muted">Пусто</div>');
    }
    if(tab==='combat'){
      html = card('⚔️ Тактика автобоя', Object.entries(TACTICS).map(([k,v])=>
        `<button class="btn ${h.tactic===k?'':'ghost'}" onclick="act('tactic',{tactic:'${k}'})">${v}</button>`).join(' ')+
        `<div class="muted" style="margin-top:8px">Стиль боя учитывается автобоем. Зелья и умения — в бою в чате.</div>`);
    }
    if(tab==='events'){
      html = (STATE.events&&STATE.events.length) ? STATE.events.map(e=>card('📖 '+e.name,
        `<div class="muted">${(e.desc||'').slice(0,160)}</div><div class="muted">Статус: ${e.status}</div>`)).join('')
        : card('📖 События','<div class="muted">Событий пока нет</div>');
    }
    if(tab==='ency'){ html = await renderEnc(); }
    if(tab==='worlds'){
      html = STATE.scenarios.map(w=>card(`${w.active?'✅ ':''}${w.name} (${w.genre})`,
        w.active?'<div class="muted">Активный мир</div>':`<button class="btn" onclick="act('switch',{scenario:${w.id}})">Переключить</button>`)).join('');
    }
  }
  el('content').innerHTML = html;
}
refresh();
</script>
</body>
</html>
