<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14101f">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>LitRPG Меню</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- ЕДИНСТВЕННАЯ строка стилей: css/menu.css -->
<link rel="stylesheet" href="css/menu.css?v=23">
<style>
/* Фикс 18.09.2026: аватар героя — ПО ЦЕНТРУ шапки и БЕЗ прозрачности. */
#hdr{position:relative;overflow:hidden;display:block !important;text-align:center;}
#hdr-bg{position:absolute !important;left:0 !important;top:0 !important;
  width:100% !important;height:100% !important;inset:0 !important;
  background-size:cover;background-position:center top;opacity:.55;z-index:0;}
#hdr-col{position:relative;z-index:1;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;gap:6px;
  padding:14px 12px 12px;min-height:212px;box-sizing:border-box;}
#hdr-avatar{position:relative !important;left:auto !important;right:auto !important;
  top:auto !important;bottom:auto !important;transform:none !important;
  float:none !important;margin:0 auto !important;opacity:1 !important;
  width:92px !important;height:92px !important;border-radius:50% !important;
  overflow:hidden;background:#2d2547;border:3px solid rgba(255,255,255,.4);
  display:flex;align-items:center;justify-content:center;font-size:40px;}
#hdr-avatar img{width:100%;height:100%;object-fit:cover;
  border-radius:50%;opacity:1 !important;}
#hdr-name{position:relative;opacity:1 !important;color:#fff;font-weight:600;
  text-shadow:0 1px 4px rgba(0,0,0,.6);}
#hdr-chips{position:relative;opacity:1 !important;display:flex;flex-wrap:wrap;
  gap:6px;justify-content:center;}
/* Фикс 19.09.2026 v12: навигация — обычный блок внизу (НЕ fixed), чтобы
   строка «↩ Назад» внутри неё не участвовала в войнах z-index/fixed. */
#nav{position:static !important;z-index:auto !important;
  overflow:visible !important;max-height:none !important;
  flex:0 0 auto;box-sizing:border-box;}
#nav .backrow{padding:6px 10px 0;border-top:1px solid #2d2547;}
/* Компоновка v13 (20.09.2026, требование владельца «шапка занимает слишком
   много места»): шапка БОЛЬШЕ не закреплена — она лежит ВНУТРИ скролл-
   контейнера #scrollwrap и уезжает вверх вместе с контентом; #screen —
   только обёртка контента (её чистит роутер, шапка не теряется);
   навигация остаётся внизу экрана. */
html,body{height:100%;margin:0;overflow:hidden;}
body{display:flex;flex-direction:column;}
#scrollwrap{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  box-sizing:border-box;}
#screen{padding-bottom:8px;box-sizing:border-box;}
</style>
</head>
<body>
<div id="scrollwrap">
<header id="hdr">
  <div id="hdr-bg"></div>
  <div id="hdr-col">
    <div id="hdr-avatar">👤</div>
    <div id="hdr-name">—</div>
    <div id="hdr-chips"></div>
  </div>
</header>

<main id="screen"></main>
</div>
<!-- Кнопка «↩ Назад» вставляется роутером ПЕРВОЙ строкой внутрь #nav (v12);
     отдельного плавающего блока больше нет — перекрывать/затирать нечего. -->
<nav id="nav"></nav>

<!-- ПОРЯДОК: api → router → dict_ru → экраны → app последним.
     НЕ подключать (дубли/битые): js/inventory_shared.js, js/screen_items.js,
     js/screen_wardrobe.js -->
<script>
var APP_VERSION = 88;
var APP_SCRIPTS = [
  'js/api.js','js/router.js','js/dict_ru.js',
  'js/screen_home.js','js/screen_hero.js',
  'js/screen_hero_personality.js',
  'js/screen_npcinv.js','js/screen_inventory.js',
  'js/screen_item.js','js/screen_npc.js',
  'js/screen_party.js','js/screen_trade.js',
  'js/ui_forms.js',
  'js/ui_ency_forms.js',
  'js/screen_ency.js',
  'js/screen_ency_cards.js',
  'js/screen_ency_edit.js',
  'js/screen_ency_new.js',
  'js/screen_face_crop.js',
  'js/screen_map.js',
  'js/screen_time.js','js/screen_quests.js',
  'js/screen_arbiter.js','js/screen_worlds.js',
  'js/screen_rel.js','js/screen_skill.js',
  'js/screen_skills.js','js/screen_face.js',
  'js/screen_wardrobe_edit.js','js/screen_wardrobe_batch.js',
  'js/ui_progress.js',
  'js/app.js'
];
APP_SCRIPTS.forEach(function(s){
  document.write('<script src="'+s+'?v='+APP_VERSION+'"><\/script>');
});
</script>
</body>
</html>
