<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LitRPG Меню</title>
<style>
:root{--bg:#14101f;--card:#1e1830;--acc:#7c4dff;--txt:#eee;--mut:#9a8fb8}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:var(--bg);color:var(--txt);padding-bottom:74px}
header{position:relative;height:158px;background:#4a2f8f;background-size:cover;background-position:center}
#avatar{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:86px;height:86px;border-radius:50%;background:#8866cc;background-size:cover;border:2px solid #fff3}
#hname{position:absolute;top:106px;width:100%;text-align:center;font-weight:700}
#chips{position:absolute;top:128px;width:100%;text-align:center;font-size:12px;color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:#0d0a16;border-top:1px solid #333}
nav button{flex:0 0 auto;padding:11px 9px;background:none;border:none;color:var(--mut);font-size:11px}
nav button.on{color:#fff;background:var(--acc)}
main{padding:10px}
section{display:none}section.on{display:block}
.card{background:var(--card);border-radius:12px;padding:10px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;margin:4px 0}
.btn{background:var(--acc);border:none;color:#fff;border-radius:8px;padding:8px 10px;margin:2px;font-size:13px}
.btn.sec{background:#332a4d}
input,select,textarea{width:100%;background:#241d3a;border:1px solid #443a66;border-radius:8px;color:var(--txt);padding:8px;margin:4px 0}
.sub{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.mut{color:var(--mut);font-size:12px}
img.thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;background:#333}
.bar{height:8px;border-radius:4px;background:#333;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;background:#4caf50}
</style>
</head>
<body>
<header id="hdr"><div id="avatar"></div><div id="hname"></div><div id="chips"></div></header>
<main>
<section id="tab-home" class="on"></section>
<section id="tab-hero"></section>
<section id="tab-items"></section>
<section id="tab-map"></section>
<section id="tab-party"></section>
<section id="tab-time"></section>
<section id="tab-ency"></section>
<section id="tab-arb"></section>
<section id="tab-worlds"></section>
</main>
<nav id="nav"></nav>
<script>
const API = location.hostname.endsWith('github.io')
  ? 'https://unexpired-pogo-splotchy.ngrok-free.dev' : '';
const TG = window.Telegram ? window.Telegram.WebApp : null;
let S = null, curEncy = 'npc_named', curEntity = null, curId = null;
const TABS = [['home','Домой'],['hero','Герой'],['items','Вещи'],['map','Карта'],
  ['party','Группа'],['time','Время'],['ency','Энцикл.'],['arb','Арбитр'],['worlds','Миры']];
const ENCY = [['scenario','Мир'],['location','Локации'],['npc_base','НПС Базовые'],
  ['npc_named','НПС с Именем'],['item','Предметы'],['cskill','Боевые ум.'],
  ['nskill','Мирные ум.'],['effect','Эффекты'],['race','Расы'],['faction','Фракции']];
const STAT_RU = {strength:'Сила',magic_power:'Маг. сила',intelligence:'Интеллект',
  health:'Здоровье',max_health:'Макс. здоровье',speed:'Скорость',armor:'Броня',
  luck:'Удача',charisma:'Харизма',crit_chance_phys:'Крит физ %',
  crit_multiplier_phys:'Крит физ ×',crit_chance_mag:'Крит маг %',
  crit_multiplier_mag:'Крит маг ×'};
async function api(p, b){
  const r = await fetch(API + p, {method:'POST',
    headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},
    body: JSON.stringify(Object.assign({init_data: TG ? TG.initData : ''}, b || {}))});
  return r.json();
}
const el = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/[<>&]/g,
  c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
function bar(hp, mx){ const p = mx ? Math.max(0, Math.min(100, hp*100/mx)) : 0;
  return `<div class="bar"><i style="width:${p}%"></i></div><span class="mut">${hp}/${mx}</span>`; }
function tabs(){ el('nav').innerHTML = TABS.map(t =>
  `<button data-t="${t[0]}">${t[1]}</button>`).join('');
  el('nav').onclick = e => { const t = e.target.dataset.t; if(!t) return;
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t===t));
    document.querySelectorAll('main section').forEach(s => s.classList.toggle('on', s.id==='tab-'+t));
    if(t==='time') loadTime(); if(t==='ency') loadEncyList(); };
  document.querySelector('nav button').classList.add('on'); }
function header(){ const h = S.hero, sc = S.scenario;
  el('hdr').style.backgroundImage = sc.image ? `url(${API}${sc.image})` : '';
  el('avatar').style.backgroundImage = h.image ? `url(${API}${h.image})` : '';
  el('hname').textContent = `${h.name} · ${h.gender==='female'?'Женщина':'Мужчина'} · ${h.position||''}`;
  el('chips').innerHTML = `⭐ Ур. ${h.level} · 💰 ${h.gold} · ❤️ ${h.hp}/${h.max_hp} · 🌍 ${sc.name}`; }
function renderHome(){ const sc = S.scenario;
  el('tab-home').innerHTML = `<div class="card"><b>${esc(sc.name)}</b>
   <div class="mut">${esc(sc.genre||'')}</div><p>${esc(sc.desc||'')}</p></div>
   <div class="card"><b>События</b>${(S.events||[]).map(e =>
     `<div class="row">• ${esc(e.name)} <span class="mut">${esc(e.status)}</span></div>`).join('')||'<div class="mut">Нет событий</div>'}</div>`; }
function renderHero(){ const h = S.hero;
  const stats = Object.entries(h.stats||{}).map(([k,v]) =>
    `<div class="row">${STAT_RU[k]||k}: <b>${v}</b></div>`).join('');
  const eq = (h.equipped||[]).map(e =>
    `<div class="row">${e.img?`<img class="thumb" src="${API}${e.img}">`:''} ${esc(e.slot)}: ${esc(e.name)}</div>`).join('')||'<div class="mut">Пусто</div>';
  el('tab-hero').innerHTML = `<div class="card"><b>Характеристики</b>${stats}</div>
   <div class="card"><b>Экипировка</b>${eq}</div>
   <div class="card"><b>Внешность</b>
    <textarea id="hprompt" rows="3">${esc(h.image_prompt||'')}</textarea>
    <button class="btn" onclick="genHero()">🎨 Сгенерировать</button>
    <button class="btn sec" onclick="saveHero()">💾 Сохранить</button></div>`; }
async function genHero(){ await api('/api/gen_hero_image', {}); alert('🎨 Готово'); load(); }
async function saveHero(){ await api('/api/ency/update', {entity:'hero', id:S.hero.id,
  fields:{image_prompt: el('hprompt').value}}); alert('💾 Сохранено'); load(); }
function renderItems(){ el('tab-items').innerHTML = (S.inventory||[]).map(i =>
  `<div class="card"><div class="row">${i.img?`<img class="thumb" src="${API}${i.img}">`:''}
   <div><b>${esc(i.name)}</b> ×${i.qty}<div class="mut">слот ${esc(i.slot)} · q${i.quality}</div></div></div>
   ${i.slot==='consumable'?`<button class="btn" onclick="act('use_item',{inv:${i.inv}})">Использовать</button>`:''}
   ${['consumable','quest'].includes(i.slot)?'':`<button class="btn sec" onclick="act('equip',{inv:${i.inv}})">Надеть</button>`}
   </div>`).join('') || '<div class="card mut">Инвентарь пуст</div>'; }
function renderMap(){ el('tab-map').innerHTML = (S.locations||[]).map(l =>
  `<div class="card"><div class="row">${l.image?`<img class="thumb" src="${API}${l.image}">`:''}
   <div><b>${esc(l.name)}</b> ${l.current?'📍':''}<div class="mut">${esc((l.desc||'').slice(0,90))}</div></div></div>
   ${l.current?'':`<button class="btn" onclick="act('travel',{loc:${l.id}})">🚶 Переместиться</button>`}
   </div>`).join(''); }
function renderParty(){ const p = S.party || [];
  el('tab-party').innerHTML = `<div class="card"><b>👥 Группа (${p.length}/10)</b>
   ${p.map(n => `<div class="row">${n.gender==='female'?'👩':'🧑'} <b>${esc(n.name)}</b>
     ур.${n.level} <span class="mut">${esc(n.race||'')}</span></div>${bar(n.hp,n.max_hp)}`).join('')
     || '<div class="mut">Группа пуста. Добавь через чат: «возьми X в группу» или /party add &lt;id&gt;</div>'}</div>`; }
async function loadTime(){ const t = await api('/api/time', {});
  const mod = t.minute_of_day != null ? t.minute_of_day : 480;
  const toEven = Math.max(5, 1080 - mod), toNight = Math.max(5, 1320 - mod),
        toMorn = (1440 - mod) + 480;
  el('tab-time').innerHTML = `<div class="card"><b>⏰ Время</b>
   <div>${esc(t.date||t.game_date||'')} · ${esc(t.time||(''))} </div>
   <div class="mut">Сезон: ${esc(t.season||'')} · Погода: ${esc(t.weather||'')} · ${t.temperature_c!=null?t.temperature_c+'°C':''}</div>
   <button class="btn" onclick="adv(30)">+30 мин</button>
   <button class="btn" onclick="adv(60)">+1 час</button>
   <button class="btn" onclick="adv(180)">+3 часа</button>
   <button class="btn sec" onclick="adv(${toEven})">Сегодня вечер</button>
   <button class="btn sec" onclick="adv(${toNight})">Сегодня ночь</button>
   <button class="btn sec" onclick="adv(${toMorn})">Завтра утро</button>
   <input id="tmin" type="number" placeholder="Минут для точной перемотки">
   <button class="btn" onclick="adv(+el('tmin').value||0)">⌨️ Перемотать</button></div>`; }
async function adv(m){ if(!m) return alert('Укажи минуты'); await api('/api/advance_time',{minutes:m});
  alert('⏩ Время перемотано'); load(); loadTime(); }
async function loadEncyList(){ el('tab-ency').innerHTML =
  `<div class="sub">${ENCY.map(e => `<button class="btn sec" data-e="${e[0]}">${e[1]}</button>`).join('')}</div>
   <div id="encylist"></div><div id="encyedit"></div>`;
  el('tab-ency').querySelectorAll('[data-e]').forEach(b => b.onclick = () => {
    curEncy = b.dataset.e; fillEncyList(); });
  fillEncyList(); }
async function fillEncyList(){ const r = await api('/api/ency/list', {entity: curEncy});
  el('encylist').innerHTML = (r.rows||[]).map(x =>
   `<div class="card row">${x.img?`<img class="thumb" src="${API}${x.img}">`:''}
    <b>${esc(x.name)}</b><button class="btn sec" onclick="openRec(${x.id})">✏️</button></div>`).join('')
   || '<div class="mut">Пусто</div>'; }
async function openRec(id){ curId = id; const r = await api('/api/ency/get', {entity: curEncy, id});
  if(!r.ok) return; const rec = r.rec;
  const skip = new Set([ 'npc_id','item_id','location_id','scenario_id','hero_id','race_id',
    'faction_id','effect_id','combat_skill_id','noncombat_skill_id','image_media_id']);
  el('encyedit').innerHTML = `<div class="card"><b>✏️ ${esc(rec.name||('#'+id))}</b>` +
   Object.entries(rec).filter(([k]) => !skip.has(k)).map(([k,v]) => {
     const val = v == null ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
     return `<label class="mut">${k}</label>` +
       (val.length > 60 ? `<textarea data-f="${k}" rows="2">${esc(val)}</textarea>`
                        : `<input data-f="${k}" value="${esc(val)}">`);
   }).join('') +
   `<button class="btn" onclick="saveRec()">💾 Сохранить</button>
    <button class="btn sec" onclick="genRec()">🎨 Картинка</button></div>`; }
async function saveRec(){ const fields = {};
  el('encyedit').querySelectorAll('[data-f]').forEach(i => { fields[i.dataset.f] = i.value; });
  await api('/api/ency/update', {entity: curEncy, id: curId, fields});
  alert('💾 Сохранено'); fillEncyList(); }
async function genRec(){ const map = {npc_base:'npc', npc_named:'npc', item:'item',
    location:'location', scenario:'scenario'};
  const t = map[curEncy]; if(!t) return alert('Для этого типа генерация недоступна');
  await api('/api/gen_entity_image', {entity_type: t, id: curId}); alert('🎨 Готово'); }
async function sendArb(){ const txt = el('arbin').value; if(!txt) return;
  el('arblog').innerHTML += `<div class="card"><b>Ты:</b> ${esc(txt)}</div>`;
  el('arbin').value = ''; const r = await api('/api/arbiter', {text: txt});
  el('arblog').innerHTML += `<div class="card"><b>Арбитр:</b> ${esc(r.reply||r.error||'')}</div>`;
  el('arblog').scrollTop = 1e6; }
function renderArb(){ el('tab-arb').innerHTML = `<div id="arblog"></div>
  <div class="row"><input id="arbin" placeholder="Вопрос Арбитру...">
  <button class="btn" onclick="sendArb()">➤</button></div>`; }
function renderWorlds(){ el('tab-worlds').innerHTML = (S.scenarios||[]).map(w =>
  `<div class="card">${w.image?`<img class="thumb" src="${API}${w.image}">`:''}
   <b>${esc(w.name)}</b> ${w.active?'✅':''}<div class="mut">${esc(w.genre||'')}</div>
   ${w.active?'':`<button class="btn" onclick="act('switch',{scenario:${w.id}})">Сделать активным</button>`}
   <button class="btn sec" onclick="resetWorld(${w.id})">♻️ Сбросить</button></div>`).join(''); }
async function resetWorld(id){ if(!confirm('Сбросить мир?')) return;
  await fetch(API + '/api/reset_world', {method:'POST',
    headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},
    body: JSON.stringify({init_data: TG ? TG.initData : '', scenario_id: id})});
  alert('♻️ Мир сброшен'); load(); }
async function act(a, p){ const r = await api('/api/menu/action', {action: a, params: p});
  if(r && r.error) alert('❌ ' + r.error); load(); }
async function load(){ S = await api('/api/menu/state', {}); if(!S.ok) return;
  header(); renderHome(); renderHero(); renderItems(); renderMap();
  renderParty(); renderWorlds(); }
tabs(); renderArb(); load();
</script>
</body>

   ${i.slot==='consumable'?`<button class="btn" onclick="act('use_item',{inv:${i.inv}})">Использовать</button>`:''}
   ${['consumable','quest'].includes(i.slot)?'':`<button class="btn sec" onclick="act('equip',{inv:${i.inv}})">Надеть</button>`}
   </div>`).join('') || '<div class="card mut">Инвентарь пуст</div>'; }
function renderMap(){ el('tab-map').innerHTML = (S.locations||[]).map(l =>
  `<div class="card"><div class="row">${l.image?`<img class="thumb" src="${API}${l.image}">`:''}
   <div><b>${esc(l.name)}</b> ${l.current?'📍':''}<div class="mut">${esc((l.desc||'').slice(0,90))}</div></div></div>
   ${l.current?'':`<button class="btn" onclick="act('travel',{loc:${l.id}})">🚶 Переместиться</button>`}
   </div>`).join(''); }
function renderParty(){ const p = S.party || [];
  el('tab-party').innerHTML = `<div class="card"><b>👥 Группа (${p.length}/10)</b>
   ${p.map(n => `<div class="row">${n.gender==='female'?'👩':'🧑'} <b>${esc(n.name)}</b>
     ур.${n.level} <span class="mut">${esc(n.race||'')}</span></div>${bar(n.hp,n.max_hp)}`).join('')
     || '<div class="mut">Группа пуста. Добавь через чат: «возьми X в группу» или /party add &lt;id&gt;</div>'}</div>`; }
async function loadTime(){ const t = await api('/api/time', {});
  const mod = t.minute_of_day != null ? t.minute_of_day : 480;
  const toEven = Math.max(5, 1080 - mod), toNight = Math.max(5, 1320 - mod),
        toMorn = (1440 - mod) + 480;
  el('tab-time').innerHTML = `<div class="card"><b>⏰ Время</b>
   <div>${esc(t.date||t.game_date||'')} · ${esc(t.time||(''))} </div>
   <div class="mut">Сезон: ${esc(t.season||'')} · Погода: ${esc(t.weather||'')} · ${t.temperature_c!=null?t.temperature_c+'°C':''}</div>
   <button class="btn" onclick="adv(30)">+30 мин</button>
   <button class="btn" onclick="adv(60)">+1 час</button>
   <button class="btn" onclick="adv(180)">+3 часа</button>
   <button class="btn sec" onclick="adv(${toEven})">Сегодня вечер</button>
   <button class="btn sec" onclick="adv(${toNight})">Сегодня ночь</button>
   <button class="btn sec" onclick="adv(${toMorn})">Завтра утро</button>
   <input id="tmin" type="number" placeholder="Минут для точной перемотки">
   <button class="btn" onclick="adv(+el('tmin').value||0)">⌨️ Перемотать</button></div>`; }
async function adv(m){ if(!m) return alert('Укажи минуты'); await api('/api/advance_time',{minutes:m});
  alert('⏩ Время перемотано'); load(); loadTime(); }
async function loadEncyList(){ el('tab-ency').innerHTML =
  `<div class="sub">${ENCY.map(e => `<button class="btn sec" data-e="${e[0]}">${e[1]}</button>`).join('')}</div>
   <div id="encylist"></div><div id="encyedit"></div>`;
  el('tab-ency').querySelectorAll('[data-e]').forEach(b => b.onclick = () => {
    curEncy = b.dataset.e; fillEncyList(); });
  fillEncyList(); }
async function fillEncyList(){ const r = await api('/api/ency/list', {entity: curEncy});
  el('encylist').innerHTML = (r.rows||[]).map(x =>
   `<div class="card row">${x.img?`<img class="thumb" src="${API}${x.img}">`:''}
    <b>${esc(x.name)}</b><button class="btn sec" onclick="openRec(${x.id})">✏️</button></div>`).join('')
   || '<div class="mut">Пусто</div>'; }
async function openRec(id){ curId = id; const r = await api('/api/ency/get', {entity: curEncy, id});
  if(!r.ok) return; const rec = r.rec;
  const skip = new Set([ 'npc_id','item_id','location_id','scenario_id','hero_id','race_id',
    'faction_id','effect_id','combat_skill_id','noncombat_skill_id','image_media_id']);
  el('encyedit').innerHTML = `<div class="card"><b>✏️ ${esc(rec.name||('#'+id))}</b>` +
   Object.entries(rec).filter(([k]) => !skip.has(k)).map(([k,v]) => {
     const val = v == null ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
     return `<label class="mut">${k}</label>` +
       (val.length > 60 ? `<textarea data-f="${k}" rows="2">${esc(val)}</textarea>`
                        : `<input data-f="${k}" value="${esc(val)}">`);
   }).join('') +
   `<button class="btn" onclick="saveRec()">💾 Сохранить</button>
    <button class="btn sec" onclick="genRec()">🎨 Картинка</button></div>`; }
async function saveRec(){ const fields = {};
  el('encyedit').querySelectorAll('[data-f]').forEach(i => { fields[i.dataset.f] = i.value; });
  await api('/api/ency/update', {entity: curEncy, id: curId, fields});
  alert('💾 Сохранено'); fillEncyList(); }
async function genRec(){ const map = {npc_base:'npc', npc_named:'npc', item:'item',
    location:'location', scenario:'scenario'};
  const t = map[curEncy]; if(!t) return alert('Для этого типа генерация недоступна');
  await api('/api/gen_entity_image', {entity_type: t, id: curId}); alert('🎨 Готово'); }
async function sendArb(){ const txt = el('arbin').value; if(!txt) return;
  el('arblog').innerHTML += `<div class="card"><b>Ты:</b> ${esc(txt)}</div>`;
  el('arbin').value = ''; const r = await api('/api/arbiter', {text: txt});
  el('arblog').innerHTML += `<div class="card"><b>Арбитр:</b> ${esc(r.reply||r.error||'')}</div>`;
  el('arblog').scrollTop = 1e6; }
function renderArb(){ el('tab-arb').innerHTML = `<div id="arblog"></div>
  <div class="row"><input id="arbin" placeholder="Вопрос Арбитру...">
  <button class="btn" onclick="sendArb()">➤</button></div>`; }
function renderWorlds(){ el('tab-worlds').innerHTML = (S.scenarios||[]).map(w =>
  `<div class="card">${w.image?`<img class="thumb" src="${API}${w.image}">`:''}
   <b>${esc(w.name)}</b> ${w.active?'✅':''}<div class="mut">${esc(w.genre||'')}</div>
   ${w.active?'':`<button class="btn" onclick="act('switch',{scenario:${w.id}})">Сделать активным</button>`}
   <button class="btn sec" onclick="resetWorld(${w.id})">♻️ Сбросить</button></div>`).join(''); }
async function resetWorld(id){ if(!confirm('Сбросить мир?')) return;
  await fetch(API + '/api/reset_world', {method:'POST',
    headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},
    body: JSON.stringify({init_data: TG ? TG.initData : '', scenario_id: id})});
  alert('♻️ Мир сброшен'); load(); }
async function act(a, p){ const r = await api('/api/menu/action', {action: a, params: p});
  if(r && r.error) alert('❌ ' + r.error); load(); }
async function load(){ S = await api('/api/menu/state', {}); if(!S.ok) return;
  header(); renderHome(); renderHero(); renderItems(); renderMap();
  renderParty(); renderWorlds(); }
tabs(); renderArb(); load();
</script>
</body>
</html>
